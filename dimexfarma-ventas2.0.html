<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>DIMEXFARMA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070f;color:#eeeeff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
input,select,textarea,button{font-family:inherit}
#hdr{background:#111120;border-bottom:1px solid #252540;padding:12px 16px;position:sticky;top:0;z-index:100}
.logo{font-weight:800;font-size:18px;color:#eeeeff}.logo span{color:#6c63ff}
.sub2{font-size:10px;color:#555570;letter-spacing:1px;margin-top:1px}
#tbr{display:flex;background:#111120;border-bottom:1px solid #252540;position:sticky;top:50px;z-index:99;overflow-x:auto}
.tb{flex:1;min-width:52px;padding:9px 2px;border:none;background:transparent;color:#555570;border-bottom:2px solid transparent;font-size:10px;font-weight:600;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.tb.on{color:#6c63ff;border-bottom-color:#6c63ff}
.tic{font-size:13px;display:block;margin-bottom:1px}
#cnt{max-width:600px;margin:0 auto;padding:16px 12px 100px}
.card{background:#16162a;border:1px solid #252540;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.st{background:#16162a;border-radius:10px;padding:10px 12px;text-align:center}
.sv{font-size:20px;font-weight:800}.sl{font-size:10px;color:#555570;margin-top:2px}
.inp{width:100%;background:#111120;border:1px solid #252540;border-radius:8px;color:#eeeeff;padding:10px 13px;font-size:14px;outline:none}
.inp:focus{border-color:#6c63ff}
.lbl{display:block;font-size:10px;color:#555570;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;padding:9px 16px;-webkit-tap-highlight-color:transparent}
.bp{background:#6c63ff;color:#fff}.bg{background:transparent;color:#9999bb;border:1px solid #252540}
.bd{background:transparent;color:#ef4444;border:1px solid #ef444444}.bs{background:#10b981;color:#fff}
.by{background:#f59e0b;color:#fff}
.flt{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.fb{font-size:11px;padding:5px 13px;border-radius:99px;cursor:pointer;background:transparent;color:#555570;border:1px solid #252540;font-weight:600}
.fb.on{background:#6c63ff;color:#fff;border-color:#6c63ff}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700}
.pr{display:flex;align-items:center;justify-content:space-between;background:#111120;border:1px solid #252540;border-radius:8px;padding:10px 14px;gap:10px;margin-bottom:6px}
.pr.add{background:#6c63ff18;border-color:#6c63ff55}
.qc{display:flex;align-items:center;gap:6px}
.qb{background:#252540;border:none;color:#eeeeff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px}
.sr{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.shdr{display:flex;justify-content:space-between;align-items:flex-start}
.exb{background:none;border:none;color:#6c63ff;cursor:pointer;font-size:20px;transition:transform .2s;padding:0 4px;line-height:1}
.exb.op{transform:rotate(180deg)}
.sdt{margin-top:12px;padding-top:12px;border-top:1px solid #252540}
.sac{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;align-items:center}
.sbt{font-size:11px;padding:5px 11px;border-radius:99px;cursor:pointer;font-weight:600;border:none}
#tst{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:99px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 6px 24px #0009;white-space:nowrap;pointer-events:none;display:none;color:#fff}
.fc{background:#16162a;border:1px solid #252540;border-radius:12px;padding:16px;margin-bottom:16px}
.fa{display:flex;gap:8px}
.sm{background:#111120;border:1px solid #252540;border-radius:10px;padding:14px;margin-bottom:12px}
.smr{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.smt{border-top:1px solid #252540;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-weight:700}
.alt{margin-top:8px;font-size:11px;border-radius:6px;padding:5px 10px}
.emp{text-align:center;color:#555570;padding:60px 0}.ei{font-size:38px}
.ei2{width:70px;background:#111120;border:1px solid #6c63ff;border-radius:6px;color:#eeeeff;padding:6px 8px;font-size:14px;outline:none;text-align:center}
.cr{display:flex;gap:6px;align-items:center}
.bkr{display:flex;align-items:center;gap:12px;margin-bottom:20px}
textarea.inp{resize:vertical}
.frow{margin-bottom:12px}
.loading{text-align:center;color:#555570;padding:40px 0;font-size:14px}
.sdot{width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;margin-left:6px;vertical-align:middle}
.sdot.err{background:#ef4444}.sdot.spin{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#lockScreen{position:fixed;inset:0;background:#07070f;z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:30px}
.lbox{background:#111120;border:1px solid #252540;border-radius:16px;padding:28px 22px;width:100%;max-width:340px;text-align:center}
.lico{font-size:44px;margin-bottom:10px}
.ltit{font-weight:800;font-size:19px;margin-bottom:3px}
.lsub{font-size:12px;color:#555570;margin-bottom:22px}
.linp{width:100%;background:#07070f;border:1px solid #252540;border-radius:10px;color:#eeeeff;padding:12px 16px;font-size:16px;outline:none;text-align:center;letter-spacing:2px;margin-bottom:14px}
.linp:focus{border-color:#6c63ff}
.lerr{font-size:12px;color:#ef4444;margin-top:-6px;margin-bottom:10px;min-height:18px}
.cmp-card{background:#16162a;border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.cmp-card.done{opacity:0.5}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid #252540;background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.chk.on{background:#10b981;border-color:#10b981}
.tbox{background:#16162a;border:1px solid #6c63ff33;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.vcard{background:#16162a;border:1px solid #252540;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.vhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.vname{font-size:17px;font-weight:800}
.vpill{font-size:11px;padding:4px 12px;border-radius:99px;font-weight:700}
.vrow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #252540}
.vrow:last-child{border:none}
.vtotal{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #6c63ff33;font-weight:700;font-size:15px}
.vavatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0}
/* FINANZAS */
.fbox{border-radius:12px;padding:16px;margin-bottom:10px}
.fbox-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #25254033;font-size:14px}
.fbox-row:last-child{border:none}
.fbox-total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:12px;border-top:2px solid #6c63ff44;font-weight:800;font-size:17px}
.utilidad-box{border-radius:16px;padding:20px;margin-bottom:14px;text-align:center}
.utilidad-val{font-size:36px;font-weight:800;margin-bottom:4px}
.utilidad-lbl{font-size:12px;opacity:0.7;letter-spacing:1px}
.margen-bar{height:8px;border-radius:99px;background:#252540;margin:12px 0 4px;overflow:hidden}
.margen-fill{height:100%;border-radius:99px;transition:width .5s}
</style>
</head>
<body>
<div id="tst"></div>
<div id="lockScreen" style="display:none">
  <div class="lbox">
    <div class="lico">🔐</div>
    <div class="ltit">Área Restringida</div>
    <div class="lsub" id="lockSub">Solo el dueño puede acceder</div>
    <input class="linp" type="password" id="lockPwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPwd()">
    <div class="lerr" id="lockErr"></div>
    <button class="btn bp" style="width:100%;padding:12px;font-size:15px" onclick="checkPwd()">Entrar</button>
    <button class="btn bg" style="width:100%;padding:10px;font-size:13px;margin-top:8px" onclick="closeLock()">Cancelar</button>
  </div>
</div>
<div id="hdr">
  <div class="logo"><span>DIMEX</span>FARMA <span class="sdot" id="sdot"></span></div>
  <div class="sub2">SISTEMA DE VENTAS · NUBE</div>
</div>
<div id="tbr">
  <button class="tb on" id="t0" onclick="sw(0)"><span class="tic">🛒</span>Ventas</button>
  <button class="tb" id="t1" onclick="sw(1)"><span class="tic">📦</span>Almacén</button>
  <button class="tb" id="t2" onclick="sw(2)"><span class="tic">🗂️</span>Catálogo</button>
  <button class="tb" id="t3" onclick="sw(3)"><span class="tic">🛍️</span>Compras</button>
  <button class="tb" id="t4" onclick="sw(4)"><span class="tic">👥</span>Vendedores</button>
  <button class="tb" id="t5" onclick="sw(5)"><span class="tic">📊</span>Finanzas</button>
</div>
<div id="cnt"><div class="loading">⏳ Cargando datos...</div></div>
<script>
var SB_URL="https://noopxiiurbnsebenkvhx.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vb3B4aWl1cmJuc2ViZW5rdmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTQ1MTcsImV4cCI6MjA5NDI5MDUxN30.xebhO9KM27xUcGEVMhLS6gLvzxEroWj5us8_0wF9BX0";
var U=["Bastian","Dylan","Wavy"];
var SC={Pendiente:"#f59e0b",Entregado:"#10b981",Cancelado:"#ef4444"};
var UCOL={"Bastian":"#6c63ff","Dylan":"#10b981","Wavy":"#f59e0b"};
var CAT=[],INV=[],SAL=[],CMP=[];
var TAB=0,VV="list",FT="Todos",SQ="";
var NF=ef(),EXP={},CDel=null;
var IE=null,IV="";
var CS=false,CE=null,CF={n:"",p:"",u:"caja",s:""},CCD=null;
var ULOCKED={};
var PTAB=null;
var CMP_FORM=false,CNEW={product_id:"",nombre:"",cantidad:1,precio_compra:0,notas:""};
var VPERIOD="todo",VEDITING=null,VCOM_VAL="",VCOM_TIPO="fijo";
var FPERIOD="todo";
var LOADING=true;

async function hashPwd(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
var CHASH="";(async function(){CHASH=await hashPwd("Pistolasexbastian998777")})();

function ef(){return{vendedor:U[0],cliente:"",fecha:"",hora:"",lugar:"",notas:"",items:[]}}
function fmt(n){return"$"+Number(n).toLocaleString("es-MX",{minimumFractionDigits:2})}
function fmtP(n){return Number(n).toFixed(1)+"%"}
function fd(iso){if(!iso)return"—";var a=iso.split("-");return a[2]+"/"+a[1]+"/"+a[0]}
function uid(){return Date.now()+""+Math.floor(Math.random()*99999)}
function gp(id){return CAT.find(function(p){return p.id==id})}
function gs(pid){var i=INV.find(function(i){return i.product_id==pid});return i?i.stock:0}
function esc(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):""}
function setSd(st){var d=document.getElementById("sdot");if(!d)return;d.className="sdot"+(st==="ok"?"":st==="err"?" err":" spin")}

function calcCom(prod,cant){
  var com=prod.comision||0,tipo=prod.comision_tipo||"fijo";
  return tipo==="porcentaje"?(prod.precio*cant*com/100):com*cant;
}

// Utilidad por item = (precio_venta - precio_compra - comision) * cantidad
function calcUtilidadItem(prod,cant){
  var pv=prod.precio||0,pc=prod.precio_compra||0,com=calcCom(prod,cant)/cant;
  return(pv-pc-com)*cant;
}

async function sb(path,opts){
  opts=opts||{};
  var h={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=representation"};
  Object.assign(h,opts.headers||{});
  var r=await fetch(SB_URL+"/rest/v1/"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){var e=await r.text();throw new Error(e)}
  var t=await r.text();return t?JSON.parse(t):[];
}

async function loadAll(){
  LOADING=true;setSd("spin");
  try{
    CAT=await sb("catalogo?select=*&order=id");
    INV=await sb("inventario?select=*");
    SAL=await sb("ventas?select=*&order=created_at.desc");
    CMP=await sb("compras?select=*&order=created_at.desc");
    LOADING=false;setSd("ok");
    if(CAT.length===0)await seed();
    R();
  }catch(e){LOADING=false;setSd("err");toast("Error de conexión","#ef4444");document.getElementById("cnt").innerHTML='<div class="emp"><div class="ei">⚠️</div><div style="margin-top:8px">Sin conexión</div></div>'}
}

async function seed(){
  var dc=[{id:1,nombre:"Paracetamol 500mg",precio:45,precio_compra:0,comision:0,comision_tipo:"fijo",unidad:"caja"},{id:2,nombre:"Ibuprofeno 400mg",precio:60,precio_compra:0,comision:0,comision_tipo:"fijo",unidad:"caja"},{id:3,nombre:"Amoxicilina 500mg",precio:120,precio_compra:0,comision:0,comision_tipo:"fijo",unidad:"caja"}];
  var di=[{product_id:1,stock:50},{product_id:2,stock:30},{product_id:3,stock:20}];
  try{await sb("catalogo",{method:"POST",headers:{"Prefer":"resolution=ignore-duplicates"},body:dc});await sb("inventario",{method:"POST",headers:{"Prefer":"resolution=ignore-duplicates"},body:di});CAT=await sb("catalogo?select=*&order=id");INV=await sb("inventario?select=*")}catch(e){}
}

function toast(m,c){var t=document.getElementById("tst");t.textContent=m;t.style.background=c||"#10b981";t.style.display="block";clearTimeout(window._tt);window._tt=setTimeout(function(){t.style.display="none"},2500)}

function R(){
  var el=document.getElementById("cnt");
  if(LOADING){el.innerHTML='<div class="loading">⏳ Cargando...</div>';return}
  if(TAB===0)el.innerHTML=VV==="new"?rNew():rVen();
  else if(TAB===1)el.innerHTML=rInv();
  else if(TAB===2)el.innerHTML=rCat();
  else if(TAB===3)el.innerHTML=rCmp();
  else if(TAB===4)el.innerHTML=rVend();
  else el.innerHTML=rFin();
}

function sw(n){
  if((n===3||n===4||n===5)&&!ULOCKED[n]){PTAB=n;showLock(n);return}
  TAB=n;for(var i=0;i<6;i++)document.getElementById("t"+i).className="tb"+(i===n?" on":"");R();
}
function showLock(t){
  var subs={3:"Solo el dueño puede ver precios de compra",4:"Solo el dueño puede ver comisiones",5:"Solo el dueño puede ver finanzas"};
  document.getElementById("lockSub").textContent=subs[t]||"Solo el dueño puede acceder";
  document.getElementById("lockScreen").style.display="flex";
  document.getElementById("lockPwd").value="";
  document.getElementById("lockErr").textContent="";
  setTimeout(function(){document.getElementById("lockPwd").focus()},100);
}
function closeLock(){document.getElementById("lockScreen").style.display="none";PTAB=null}
async function checkPwd(){
  var v=document.getElementById("lockPwd").value,h=await hashPwd(v);
  if(h===CHASH){
    ULOCKED[PTAB]=true;closeLock();TAB=PTAB;PTAB=null;
    for(var i=0;i<6;i++)document.getElementById("t"+i).className="tb"+(i===TAB?" on":"");R();
  }else{document.getElementById("lockErr").textContent="Contraseña incorrecta";document.getElementById("lockPwd").value=""}
}

/* ═══ VENTAS ══════════════════════════════════════════════ */
function rVen(){
  var c={Pendiente:0,Entregado:0,Cancelado:0};
  SAL.forEach(function(s){if(c[s.status]!==undefined)c[s.status]++});
  var ff=SAL.filter(function(s){return FT==="Todos"||s.status===FT}).filter(function(s){return!SQ||[s.cliente,s.vendedor,s.lugar].join(" ").toLowerCase().indexOf(SQ.toLowerCase())>=0});
  var sts=Object.keys(c).map(function(k){return'<div class="st" style="border:1px solid '+SC[k]+'33"><div class="sv" style="color:'+SC[k]+'">'+c[k]+'</div><div class="sl">'+k+'</div></div>'}).join("");
  var fbs=["Todos","Pendiente","Entregado","Cancelado"].map(function(f){return'<button class="fb'+(FT===f?" on":"")+'" onclick="FT=\''+f+'\';R()">'+f+'</button>'}).join("");
  var cards=ff.length===0?'<div class="emp"><div class="ei">🛒</div><div style="margin-top:8px">Sin ventas registradas</div></div>':ff.map(rCard).join("");
  return'<div class="stats">'+sts+'</div><div class="sr"><input class="inp" placeholder="🔍 Buscar..." value="'+esc(SQ)+'" oninput="SQ=this.value;R()" style="flex:1;padding:9px 13px;font-size:13px"><button class="btn bp" onclick="VV=\'new\';NF=ef();R()">+ Nueva</button></div><div class="flt">'+fbs+'</div>'+cards
}
function rCard(s){
  var c=SC[s.status],ex=EXP[s.id],det="";
  if(ex){
    var its=(s.items||[]).map(function(it){var p=gp(it.productId);return p?'<div class="smr"><span style="color:#9999bb">• '+esc(p.nombre)+" ×"+it.cantidad+'</span><span>'+fmt(p.precio*it.cantidad)+'</span></div>':""}).join("");
    var nt=s.notas?'<div style="margin-top:8px;font-size:12px;color:#555570;font-style:italic">"'+esc(s.notas)+'"</div>':"";
    var sbs=Object.keys(SC).map(function(st){return'<button class="sbt" style="background:'+(s.status===st?c:"transparent")+';color:'+(s.status===st?"#fff":c)+';border:1px solid '+c+'" onclick="chgS(\''+s.id+'\',\''+st+'\')">'+st+'</button>'}).join("");
    var db=CDel===s.id?'<div class="cr"><span style="font-size:11px;color:#ef4444">¿Seguro?</span><button class="btn bd" style="background:#ef4444;color:#fff;font-size:11px;padding:5px 11px" onclick="delS(\''+s.id+'\')">Sí</button><button class="btn bg" style="font-size:11px;padding:5px 11px" onclick="CDel=null;R()">No</button></div>':'<button class="btn bd" style="font-size:11px;padding:5px 11px" onclick="CDel=\''+s.id+'\';R()">Eliminar</button>';
    det='<div class="sdt"><span class="lbl">Productos</span>'+its+nt+'<div class="sac">'+sbs+'<div style="margin-left:auto">'+db+'</div></div></div>'
  }
  return'<div class="card" style="'+(ex?"box-shadow:0 0 0 2px #6c63ff33":"")+'"><div class="shdr"><div style="flex:1"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px"><span class="badge" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'44">'+s.status+'</span><span style="font-size:10px;color:#555570">'+esc(s.vendedor)+'</span></div><div style="font-weight:700;font-size:15px">'+esc(s.cliente)+'</div><div style="font-size:11px;color:#9999bb;margin-top:2px">📅 '+fd(s.fecha)+' · 🕐 '+(s.hora||"—")+'</div>'+(s.lugar?'<div style="font-size:11px;color:#7c6fff;margin-top:2px">📍 '+esc(s.lugar)+'</div>':"")+'<div style="font-size:13px;color:#6c63ff;font-weight:700;margin-top:4px">'+fmt(s.total)+'</div></div><button class="exb'+(ex?" op":"")+'" onclick="EXP[\''+s.id+'\']=!EXP[\''+s.id+'\'];R()">▾</button></div>'+det+'</div>'
}
function ctI(its){return its.reduce(function(s,i){var p=gp(i.productId);return s+(p?p.precio*i.cantidad:0)},0)}
function rNew(){
  var uo=U.map(function(u){return'<option'+(NF.vendedor===u?" selected":"")+'>'+u+'</option>'}).join("");
  var pr=CAT.map(function(prod){
    var stk=gs(prod.id),ad=NF.items.find(function(i){return i.productId==prod.id});
    var ctrl=ad?'<div class="qc"><button class="qb" onclick="updQ('+prod.id+','+(ad.cantidad-1)+')">−</button><span style="min-width:24px;text-align:center;font-weight:700">'+ad.cantidad+'</span><button class="qb" onclick="updQ('+prod.id+','+(ad.cantidad+1)+')">+</button><button style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;padding:0 4px" onclick="remI('+prod.id+')">✕</button></div>':'<button class="btn bg" style="font-size:12px;padding:5px 12px;'+(stk===0?"opacity:0.4":"")+'" '+(stk===0?"disabled":"")+' onclick="addI('+prod.id+')">'+(stk===0?"Sin stock":"+ Agregar")+'</button>';
    return'<div class="pr'+(ad?" add":"")+'"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">'+esc(prod.nombre)+'</div><div style="font-size:11px;color:#9999bb">'+fmt(prod.precio)+'/'+prod.unidad+' · Stock: '+stk+'</div></div>'+ctrl+'</div>'

function filtrarVentas(ventas){
  var now=new Date(),v=ventas.filter(function(s){return s.status!=="Cancelado"});
  if(VPERIOD==="mes"){var m=now.getMonth(),y=now.getFullYear();v=v.filter(function(s){if(!s.fecha)return false;var d=new Date(s.fecha);return d.getMonth()===m&&d.getFullYear()===y})}
  else if(VPERIOD==="semana"){var lun=new Date(now);lun.setDate(now.getDate()-now.getDay()+1);lun.setHours(0,0,0,0);v=v.filter(function(s){return s.fecha&&new Date(s.fecha)>=lun})}
  return v;
}
function rVend(){
  var ventas=filtrarVentas(SAL);
  var resumen={};
  U.forEach(function(u){resumen[u]={ventas:0,total:0,comision:0,productos:[]}});
  ventas.forEach(function(s){
    if(!resumen[s.vendedor])return;
    resumen[s.vendedor].ventas++;resumen[s.vendedor].total+=s.total||0;
    (s.items||[]).forEach(function(it){
      var p=gp(it.productId);if(!p)return;
      var com=calcCom(p,it.cantidad);resumen[s.vendedor].comision+=com;
      var ex=resumen[s.vendedor].productos.find(function(x){return x.id==p.id});
      if(ex){ex.cantidad+=it.cantidad;ex.comision+=com}else resumen[s.vendedor].productos.push({id:p.id,nombre:p.nombre,cantidad:it.cantidad,comision:com});
    });
  });
  var totalPagar=Object.values(resumen).reduce(function(s,v){return s+v.comision},0);
  var pbtns=[["todo","Todo"],["mes","Este mes"],["semana","Semana"]].map(function(p){return'<button class="fb'+(VPERIOD===p[0]?" on":"")+'" onclick="VPERIOD=\''+p[0]+'\';R()">'+p[1]+'</button>'}).join("");
  var vcards=U.map(function(u){
    var r=resumen[u],col=UCOL[u]||"#6c63ff";
    var prods=r.productos.length>0?r.productos.map(function(p){return'<div class="vrow"><span style="color:#9999bb">'+esc(p.nombre)+' ×'+p.cantidad+'</span><span style="color:#10b981">'+fmt(p.comision)+'</span></div>'}).join(""):'<div style="font-size:12px;color:#555570;padding:6px 0">Sin ventas en este período</div>';
    return'<div class="vcard"><div class="vhdr"><div style="display:flex;align-items:center;gap:10px"><div class="vavatar" style="background:'+col+'22;color:'+col+'">'+u[0]+'</div><div><div class="vname">'+u+'</div><div style="font-size:11px;color:#555570">'+r.ventas+' venta'+(r.ventas!==1?"s":"")+'</div></div></div><span class="vpill" style="background:'+col+'22;color:'+col+'">'+fmt(r.total)+'</span></div>'+prods+'<div class="vtotal"><span>💰 A pagar</span><span style="color:#10b981">'+fmt(r.comision)+'</span></div></div>'
  }).join("");
  var comTable=CAT.map(function(prod){
    var isEd=VEDITING==prod.id,comVal=prod.comision||0,comTipo=prod.comision_tipo||"fijo";
    var right=isEd?'<div style="display:flex;gap:6px;align-items:center"><input style="width:65px;background:#111120;border:1px solid #6c63ff;border-radius:6px;color:#eeeeff;padding:5px 8px;font-size:13px;outline:none;text-align:center" type="number" min="0" value="'+VCOM_VAL+'" oninput="VCOM_VAL=this.value"><select style="background:#111120;border:1px solid #252540;border-radius:6px;color:#eeeeff;padding:5px;font-size:11px;outline:none" onchange="VCOM_TIPO=this.value"><option value="fijo"'+(VCOM_TIPO==="fijo"?" selected":"")+'>$ fijo</option><option value="porcentaje"'+(VCOM_TIPO==="porcentaje"?" selected":"")+'>%</option></select><button class="btn bs" style="padding:5px 10px;font-size:12px" onclick="savCom('+prod.id+')">✓</button><button class="btn bg" style="padding:5px 8px;font-size:12px" onclick="VEDITING=null;R()">✕</button></div>':'<div style="display:flex;align-items:center;gap:8px"><span style="font-size:13px;color:#10b981;font-weight:600">'+(comTipo==="porcentaje"?comVal+"%":fmt(comVal))+'</span><button class="btn bg" style="padding:4px 10px;font-size:11px" onclick="VEDITING='+prod.id+';VCOM_VAL=\''+comVal+'\';VCOM_TIPO=\''+comTipo+'\';R()">✏️</button></div>';
    return'<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#16162a;border-radius:8px;margin-bottom:6px"><div style="flex:1"><div style="font-size:13px;font-weight:600">'+esc(prod.nombre)+'</div><div style="font-size:11px;color:#555570">Venta: '+fmt(prod.precio)+'/'+prod.unidad+'</div></div>'+right+'</div>'
  }).join("");
  return'<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-weight:700;font-size:15px">Vendedores 🔐</div><div style="font-size:12px;color:#10b981;font-weight:700">Total a pagar: '+fmt(totalPagar)+'</div></div><div class="flt">'+pbtns+'</div>'+vcards+'<div style="border-top:1px solid #252540;margin:18px 0"></div><div style="font-weight:700;font-size:14px;margin-bottom:12px">💵 Comisiones por producto</div>'+comTable+'</div>'
}
async function savCom(pid){
  var v=parseFloat(VCOM_VAL);if(isNaN(v)||v<0){toast("Valor inválido","#ef4444");return}
  setSd("spin");try{await sb("catalogo?id=eq."+pid,{method:"PATCH",body:{comision:v,comision_tipo:VCOM_TIPO}});VEDITING=null;await loadAll();toast("Comisión actualizada ✓");R()}catch(e){setSd("err");toast("Error","#ef4444")}
}

/* ═══ FINANZAS ════════════════════════════════════════════ */
function rFin(){
  var ventas=filtrarVentas(SAL);
  // Calcular totales reales
  var totalVentas=0,totalCostos=0,totalComisiones=0,totalUtilidad=0;
  ventas.forEach(function(s){
    totalVentas+=s.total||0;
    (s.items||[]).forEach(function(it){
      var p=gp(it.productId);if(!p)return;
      totalCostos+=(p.precio_compra||0)*it.cantidad;
      totalComisiones+=calcCom(p,it.cantidad);
    });
  });
  totalUtilidad=totalVentas-totalCostos-totalComisiones;
  var margen=totalVentas>0?(totalUtilidad/totalVentas*100):0;
  var margenColor=margen>30?"#10b981":margen>10?"#f59e0b":"#ef4444";

  // Por vendedor
  var porVend=U.map(function(u){
    var vv=ventas.filter(function(s){return s.vendedor===u}),tv=0,tc=0,tcom=0;
    vv.forEach(function(s){tv+=s.total||0;(s.items||[]).forEach(function(it){var p=gp(it.productId);if(!p)return;tc+=(p.precio_compra||0)*it.cantidad;tcom+=calcCom(p,it.cantidad)})});
    return{nombre:u,ventas:vv.length,total:tv,costo:tc,comision:tcom,utilidad:tv-tc-tcom};
  });

  // Por producto (top)
  var porProd={};
  ventas.forEach(function(s){(s.items||[]).forEach(function(it){var p=gp(it.productId);if(!p)return;var pid=p.id;if(!porProd[pid])porProd[pid]={nombre:p.nombre,cant:0,ventas:0,costo:0,comision:0};porProd[pid].cant+=it.cantidad;porProd[pid].ventas+=p.precio*it.cantidad;porProd[pid].costo+=(p.precio_compra||0)*it.cantidad;porProd[pid].comision+=calcCom(p,it.cantidad)})});
  var topProd=Object.values(porProd).sort(function(a,b){return(b.ventas-b.costo-b.comision)-(a.ventas-a.costo-a.comision)});

  var pbtns=[["todo","Todo"],["mes","Este mes"],["semana","Semana"]].map(function(p){return'<button class="fb'+(FPERIOD===p[0]?" on":"")+'" onclick="FPERIOD=\''+p[0]+'\';VPERIOD=\''+p[0]+'\';R()">'+p[1]+'</button>'}).join("");

  var utilColor=totalUtilidad>=0?"#10b981":"#ef4444";
  var html='<div style="font-weight:700;font-size:15px;margin-bottom:12px">Resumen Financiero 🔐</div>';
  html+='<div class="flt">'+pbtns+'</div>';

  // Caja grande de utilidad
  html+='<div class="utilidad-box" style="background:'+utilColor+'18;border:1px solid '+utilColor+'44">';
  html+='<div class="utilidad-val" style="color:'+utilColor+'">'+fmt(totalUtilidad)+'</div>';
  html+='<div class="utilidad-lbl">UTILIDAD NETA</div>';
  html+='<div class="margen-bar"><div class="margen-fill" style="width:'+Math.min(100,Math.max(0,margen))+'%;background:'+margenColor+'"></div></div>';
  html+='<div style="font-size:12px;color:'+margenColor+'">Margen: '+fmtP(margen)+'</div></div>';

  // Desglose general
  html+='<div class="fbox" style="background:#16162a;border:1px solid #252540">';
  html+='<div style="font-size:11px;color:#555570;font-weight:600;letter-spacing:1px;margin-bottom:8px">DESGLOSE GENERAL</div>';
  html+='<div class="fbox-row"><span style="color:#9999bb">💵 Ventas totales</span><span style="font-weight:700;color:#eeeeff">'+fmt(totalVentas)+'</span></div>';
  html+='<div class="fbox-row"><span style="color:#9999bb">🏭 Costo de productos</span><span style="font-weight:700;color:#ef4444">−'+fmt(totalCostos)+'</span></div>';
  html+='<div class="fbox-row"><span style="color:#9999bb">👥 Comisiones vendedores</span><span style="font-weight:700;color:#f59e0b">−'+fmt(totalComisiones)+'</span></div>';
  html+='<div class="fbox-total"><span>📊 Utilidad neta</span><span style="color:'+utilColor+'">'+fmt(totalUtilidad)+'</span></div></div>';

  // Por vendedor
  html+='<div style="font-weight:700;font-size:13px;margin-bottom:10px;margin-top:4px">Por vendedor</div>';
  html+=porVend.map(function(v){
    var col=UCOL[v.nombre]||"#6c63ff",uc=v.utilidad>=0?"#10b981":"#ef4444";
    return'<div class="fbox" style="background:#16162a;border:1px solid '+col+'33"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div class="vavatar" style="background:'+col+'22;color:'+col+';width:30px;height:30px;font-size:14px">'+v.nombre[0]+'</div><span style="font-weight:700">'+v.nombre+'</span><span style="font-size:11px;color:#555570">'+v.ventas+' ventas</span></div><div class="fbox-row"><span style="color:#9999bb">Ventas</span><span>'+fmt(v.total)+'</span></div><div class="fbox-row"><span style="color:#9999bb">Costo prod.</span><span style="color:#ef4444">−'+fmt(v.costo)+'</span></div><div class="fbox-row"><span style="color:#9999bb">Comisión</span><span style="color:#f59e0b">−'+fmt(v.comision)+'</span></div><div class="fbox-total"><span>Utilidad</span><span style="color:'+uc+'">'+fmt(v.utilidad)+'</span></div></div>'
  }).join("");

  // Top productos
  if(topProd.length>0){
    html+='<div style="font-weight:700;font-size:13px;margin-bottom:10px;margin-top:4px">Top productos por utilidad</div>';
    html+='<div class="fbox" style="background:#16162a;border:1px solid #252540">';
    html+=topProd.slice(0,8).map(function(p,i){
      var util=p.ventas-p.costo-p.comision,uc=util>=0?"#10b981":"#ef4444";
      return'<div class="fbox-row"><span style="color:#9999bb">'+(i+1)+'. '+esc(p.nombre)+' ×'+p.cant+'</span><span style="font-weight:700;color:'+uc+'">'+fmt(util)+'</span></div>'
    }).join("");
    html+='</div>';
  }

  if(ventas.length===0)html='<div style="font-weight:700;font-size:15px;margin-bottom:12px">Resumen Financiero 🔐</div><div class="flt">'+pbtns+'</div><div class="emp"><div class="ei">📊</div><div style="margin-top:8px">Sin ventas en este período</div></div>';
  return html;
}

loadAll();
</script>
